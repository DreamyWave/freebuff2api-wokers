name: 构建 Freebuff 模型 JSON 并发布 Release

# 每天 06:00 UTC（太平洋 23:00，太平洋日额度重置 07:00 之前）自动构建，
# 也可在 Actions 页面手动触发。
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行解析脚本（拉官方源 → 生成 freebuff-models.json）
        run: |
          node scripts/build-freebuff-models-json.mjs freebuff-models.json

      - name: 上传产物（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-models
          path: freebuff-models.json
          retention-days: 7

      - name: 创建/更新 GitHub Release（latest 标记）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d-%H%M%S)
          # 删除旧的 latest release（同名则更新）
          gh release delete latest --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release create "models-${DATE}" freebuff-models.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Freebuff Models (${DATE})" \
            --notes "动态模型映射快照。由 GitHub Actions 定时从官方 CodebuffAI/freebuff 源生成。Worker 兜底源：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/freebuff-models.json" \
            --latest
