name: 构建 Freebuff 模型快照并更新 MODELS.md

on:
  schedule:
    - cron: "0 6 * * *"   # 每天 06:00 UTC（北京时间 14:00）
  workflow_dispatch:

permissions:
  contents: write   # 提交 MODELS.md 到 main
  actions: write    # 清理旧 run 记录（gh run delete）

jobs:
  build-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行解析脚本（生成 freebuff-models.json + MODELS.md）
        run: |
          node scripts/build-freebuff-models-json.mjs freebuff-models.json

      - name: 上传 JSON 到 Release（Worker 兜底源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d-%H%M%S)
          gh release delete latest --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release create "models-${DATE}" freebuff-models.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Freebuff Models (${DATE})" \
            --notes "动态模型映射快照（北京时间 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)）" \
            --latest

      - name: 提交 MODELS.md 更新到 main（保持工作流活跃，防止 60 天无活动被禁用）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MODELS.md
          if git diff --cached --quiet; then
            echo "MODELS.md 无变化，跳过提交"
          else
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)
            git commit -m "docs: update MODELS.md (${DATE} 北京时间)" --no-verify
            git push origin main
            echo "✅ MODELS.md 已提交并推送"
          fi

      # 清理旧 run jobs：只保留最新 1 条运行记录，节省 Actions 配额
      - name: 清理旧运行记录（只保留最新 1 条）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow="${{ github.workflow }}" --limit=100 \
            --json databaseId --jq '.[].databaseId' \
            | tail -n +2 \
            | xargs -I{} gh run delete {} --repo "${{ github.repository }}" --yes 2>/dev/null || true
          echo "✅ 旧运行记录已清理"
